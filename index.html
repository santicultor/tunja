<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniSabana Modo Historia</title>
<style>
  :root{
    --azul:#00205B; --azul2:#00387b; --blanco:#fff;
    --tenue:rgba(255,255,255,.66);
    --borde:rgba(255,255,255,.22);
    --cian:#8fd0ff;
    --f:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--f);background:var(--azul);color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select{font-family:inherit}
  :focus-visible{outline:3px solid #fff;outline-offset:3px}
  .app{height:100vh;display:flex;flex-direction:column}

  /* ---------- HUD ---------- */
  .hud{flex:0 0 auto;display:flex;align-items:center;gap:clamp(.7rem,1.8vw,1.6rem);
       padding:.6rem clamp(1rem,3vw,2.4rem);border-bottom:1px solid var(--borde)}
  .hud.off{visibility:hidden}
  .batras{border:1px solid var(--borde);border-radius:7px;padding:.32rem .7rem;font-size:.74rem;
          font-weight:800;color:var(--tenue);letter-spacing:.04em}
  .batras:hover:not(:disabled){color:#fff;border-color:#fff}
  .batras:disabled{opacity:.28;cursor:default}
  .hud-p{min-width:7rem;display:flex;align-items:center;gap:.5rem}
  .hud-nom{font-size:clamp(.8rem,1.1vw,.98rem);font-weight:800}
  .hud-ruta{font-size:.7rem;color:var(--tenue)}
  .vidas{display:flex;gap:clamp(.9rem,2.2vw,2rem);margin-left:auto;align-items:center}
  .vida{display:flex;align-items:center;gap:.45rem}
  .vida .cara{font-size:clamp(1rem,1.5vw,1.35rem);line-height:1;transition:transform .25s}
  .vida .cor{font-size:clamp(.9rem,1.25vw,1.1rem);letter-spacing:.1em;color:#fff;white-space:nowrap}
  .vida .cor i{color:rgba(255,255,255,.2);font-style:normal}
  .vida .lb{font-size:.6rem;color:var(--tenue);letter-spacing:.07em;font-weight:800}
  .vida.pulso .cara{transform:scale(1.4)}
  .objs{display:flex;align-items:center;gap:.4rem;border-left:1px solid var(--borde);padding-left:clamp(.7rem,1.8vw,1.5rem)}
  .objs .n{font-size:1.1rem;font-weight:800;font-variant-numeric:tabular-nums}
  .objs .l{font-size:.6rem;color:var(--tenue);line-height:1.1}
  .flash{position:fixed;top:3.2rem;right:clamp(1rem,3vw,2.4rem);font-size:.85rem;font-weight:800;
         background:var(--azul2);border:1px solid var(--borde);border-radius:99px;padding:.34rem .95rem;z-index:30}

  /* temporizador fijo de esquina para el speaker en turno */
  .ctimer{position:fixed;right:clamp(1rem,3vw,2.2rem);bottom:clamp(1rem,3vh,2rem);z-index:32;
          background:var(--azul2);border:1px solid var(--borde);border-radius:14px;
          padding:.6rem 1.1rem;text-align:center;min-width:6.2rem;box-shadow:0 10px 30px rgba(0,10,30,.4)}
  .ctimer .lab{font-size:.6rem;letter-spacing:.13em;color:var(--cian);font-weight:800;margin-bottom:.2rem}
  .ctimer .c{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .ctimer .c.urg{color:var(--cian)}

  /* avatares animados de personaje */
  .avatar-wrap{width:60px;height:60px;margin-bottom:.55rem}
  .avatar-svg{width:100%;height:100%;overflow:visible}
  .avatar-bob{animation:bob 2.6s ease-in-out infinite;transform-origin:center}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .avatar-lids{animation:blink 4.4s infinite}
  @keyframes blink{0%,90%,100%{opacity:0}93%,96%{opacity:1}}
  .avatar-mini{width:2.1rem;height:2.1rem;flex:0 0 auto}

  .zona{flex:1 1 auto;position:relative;overflow:hidden}
  .pant{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;
        padding:clamp(1rem,3.5vh,2.4rem) clamp(1.3rem,5vw,4.5rem)}

  .kick{font-size:clamp(.72rem,1vw,.9rem);color:var(--tenue);margin-bottom:.7rem}
  .linea{font-size:clamp(1.55rem,3.8vw,3.2rem);font-weight:300;line-height:1.16;letter-spacing:-.022em;max-width:20ch}
  .linea strong{font-weight:700}
  .pista{margin-top:1.4rem;font-size:.78rem;color:rgba(255,255,255,.4)}
  .parp{animation:pp 1.2s steps(2,start) infinite}
  @keyframes pp{0%,100%{opacity:1}50%{opacity:.2}}
  .dlg{margin-top:1.2rem;border-left:3px solid var(--cian);padding:.15rem 0 .15rem 1rem;max-width:32ch}
  .dlg .q{font-size:.72rem;font-weight:800;color:var(--cian);letter-spacing:.04em}
  .dlg p{font-size:clamp(1rem,1.6vw,1.35rem);line-height:1.35;font-weight:300;margin-top:.12rem}

  /* ---------- portada ---------- */
  .consola{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
           padding:clamp(1.3rem,5vw,4.5rem)}
  .piso{position:absolute;left:-60%;right:-60%;bottom:0;height:72%;pointer-events:none;
    background-image:linear-gradient(rgba(143,208,255,.55) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(143,208,255,.55) 1px,transparent 1px);
    background-size:90px 90px;transform:perspective(420px) rotateX(61deg);transform-origin:bottom center;
    animation:piso 2.6s linear infinite;
    -webkit-mask-image:linear-gradient(transparent 6%,#000 46%);mask-image:linear-gradient(transparent 6%,#000 46%)}
  @keyframes piso{to{background-position:0 90px}}
  .halo{position:absolute;left:50%;top:38%;width:70vw;height:70vw;transform:translate(-50%,-50%);pointer-events:none;
        background:radial-gradient(circle,rgba(0,56,123,.7) 0%,rgba(0,32,91,0) 60%)}
  .cbody{position:relative;z-index:2}
  .marca{font-size:.72rem;letter-spacing:.44em;color:var(--cian);font-weight:800;margin-bottom:1rem}
  .tit{font-size:clamp(2.6rem,10vw,9rem);font-weight:800;letter-spacing:-.055em;line-height:.84;
       text-shadow:.055em .055em 0 var(--azul2)}
  .tit .l2{display:block;font-weight:200;letter-spacing:-.035em}
  .metas{display:flex;gap:1.3rem;flex-wrap:wrap;margin-top:1.2rem;font-size:.7rem;letter-spacing:.2em;
         color:var(--tenue);font-weight:800}
  .menu{margin-top:clamp(1.2rem,3.5vh,2rem);display:flex;flex-direction:column;gap:.15rem;max-width:26rem}
  .mi{display:flex;align-items:center;gap:.7rem;text-align:left;padding:.5rem .6rem;border-radius:7px;
      font-size:clamp(.95rem,1.4vw,1.12rem);font-weight:800;color:var(--tenue)}
  .mi .cur{width:1rem;opacity:0;color:var(--cian)}
  .mi.sel{color:#fff;background:rgba(255,255,255,.08)}
  .mi.sel .cur{opacity:1}
  .start{margin-top:1.1rem;font-size:clamp(.82rem,1.25vw,1rem);font-weight:800;letter-spacing:.16em;color:var(--cian)}
  .pie-v{position:absolute;bottom:1rem;left:clamp(1.3rem,5vw,4.5rem);font-size:.7rem;color:rgba(255,255,255,.3);z-index:2}

  /* ---------- acto ---------- */
  .acto{align-items:flex-start}
  .acto-n{font-size:clamp(3.5rem,13vw,11rem);font-weight:800;letter-spacing:-.06em;line-height:.8;color:var(--azul2)}
  .acto-t{font-size:clamp(1.3rem,3vw,2.4rem);font-weight:700;letter-spacing:-.02em;margin-top:.3rem}
  .acto-s{font-size:clamp(.85rem,1.2vw,1.05rem);color:var(--tenue);margin-top:.5rem;max-width:40ch;line-height:1.45}

  /* ---------- personaje ---------- */
  .pers{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.2rem}
  .pcard{text-align:left;background:var(--azul2);border:2px solid var(--borde);border-radius:16px;padding:1.1rem 1.15rem;
         transition:transform .12s,border-color .12s}
  .pcard:hover{transform:translateY(-4px);border-color:#fff}
  .pcard .pk{display:inline-grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:7px;
             background:rgba(255,255,255,.2);font-weight:800;font-size:.9rem;margin-bottom:.6rem}
  .pcard h3{font-size:clamp(1.15rem,1.9vw,1.55rem);font-weight:800;letter-spacing:-.02em}
  .pcard .tag{font-size:.85rem;color:var(--tenue);line-height:1.35;margin:.3rem 0 .9rem;min-height:2.4em}
  .pvida{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;font-size:.8rem;color:var(--tenue)}
  .pvida .cor{color:#fff;letter-spacing:.1em}
  .pvida .cor i{color:rgba(255,255,255,.2);font-style:normal}

  /* ---------- decisión ---------- */
  .dec{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(1.3rem,4vw,3.5rem);align-items:center}
  .voto{display:flex;flex-direction:column;gap:.6rem}
  .instr{font-size:.76rem;color:var(--cian);font-weight:800}
  .op{display:flex;gap:.8rem;align-items:center;text-align:left;background:var(--azul2);
      border:1px solid var(--borde);border-radius:12px;padding:.8rem 1rem;
      font-size:clamp(.88rem,1.2vw,1.05rem);line-height:1.3;transition:transform .12s,background .12s}
  .op:hover{background:#0a4a97;transform:translateX(3px)}
  .op .k{flex:0 0 1.9rem;height:1.9rem;border-radius:7px;background:rgba(255,255,255,.18);
         display:grid;place-items:center;font-weight:800;font-size:.92rem}
  .op.gana{background:#fff;color:var(--azul);border-color:#fff}
  .op.gana .k{background:var(--azul);color:#fff}
  .fila{display:flex;align-items:center;gap:.9rem;margin-top:.25rem;flex-wrap:wrap}
  .bv{background:#fff;color:var(--azul);border-radius:9px;padding:.52rem 1.05rem;font-weight:800;font-size:.86rem}
  .reloj{font-size:clamp(1.7rem,4vw,2.8rem);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .reloj.urg{color:var(--cian)}
  .duenio{position:absolute;top:clamp(1rem,3.5vh,2.4rem);right:clamp(1.3rem,5vw,4.5rem);
          font-size:.62rem;font-weight:800;letter-spacing:.18em;color:rgba(255,255,255,.3)}

  .cons .et,.invit .et{font-size:.72rem;letter-spacing:.34em;color:var(--cian);font-weight:800;margin-bottom:.8rem}

  /* ---------- inventario ---------- */
  .inv .et{font-size:.7rem;letter-spacing:.32em;color:var(--cian);font-weight:800;margin-bottom:.4rem}
  .inv h2{font-size:clamp(1.25rem,2.5vw,2.05rem);font-weight:800;letter-spacing:-.022em;line-height:1.08;max-width:22ch}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(20rem,28rem));justify-content:start;
         gap:1rem;margin-top:clamp(.9rem,2.2vh,1.4rem)}
  .card{background:var(--azul2);border:1px solid var(--borde);border-radius:18px;padding:1.4rem 1.5rem;position:relative;
        animation:entra .5s cubic-bezier(.2,.8,.2,1) backwards}
  .card:nth-child(2){animation-delay:.16s}
  @keyframes entra{from{opacity:0;transform:translateY(22px) scale(.96)}}
  .card .idx{position:absolute;top:1rem;right:1.2rem;font-size:2.4rem;font-weight:800;letter-spacing:-.04em;
             color:rgba(143,208,255,.26);line-height:1;font-variant-numeric:tabular-nums}
  .card .sello{display:inline-block;background:var(--cian);color:var(--azul);font-size:.58rem;font-weight:800;
               letter-spacing:.16em;padding:.2rem .55rem;border-radius:5px;margin-bottom:.65rem}
  .card .due{font-size:.66rem;font-weight:800;color:var(--cian);margin-bottom:.22rem;letter-spacing:.06em}
  .card h3{font-size:clamp(1.2rem,1.8vw,1.5rem);margin-bottom:.75rem;font-weight:800;letter-spacing:-.022em;max-width:15ch}
  .card ul{list-style:none;display:flex;flex-direction:column;gap:.5rem}
  .card li{font-size:clamp(.92rem,1.15vw,1.02rem);line-height:1.35;padding-left:1.05rem;position:relative;color:rgba(255,255,255,.88)}
  .card li::before{content:"";position:absolute;left:0;top:.52em;width:.36rem;height:.36rem;border-radius:50%;background:var(--cian)}
  .pie{display:flex;flex-wrap:wrap;align-items:center;gap:1.2rem;margin-top:1.1rem}
  .bseg{background:#fff;color:var(--azul);border-radius:9px;padding:.68rem 1.35rem;font-weight:800;font-size:.9rem}
  .npie{font-size:.82rem;color:var(--tenue);max-width:38ch;line-height:1.4}

  /* ---------- invitada ---------- */
  .nom{font-size:clamp(2.1rem,5.6vw,4.3rem);font-weight:800;letter-spacing:-.045em;line-height:.95}
  .rol{font-size:clamp(.92rem,1.45vw,1.2rem);color:var(--tenue);margin-top:.5rem;max-width:34ch;line-height:1.4}
  .real{font-size:.8rem;color:var(--cian);font-weight:800;margin-top:.6rem}
  .preg{margin-top:clamp(.9rem,2.2vh,1.5rem);border:1px solid var(--borde);border-left:3px solid var(--cian);
        border-radius:0 12px 12px 0;padding:.95rem 1.15rem;max-width:44ch}
  .preg .l{font-size:.62rem;letter-spacing:.14em;color:var(--cian);font-weight:800;margin-bottom:.28rem}
  .preg p{font-size:clamp(1rem,1.7vw,1.35rem);font-weight:300;line-height:1.3}
  .ireloj .c{font-size:clamp(3rem,7.5vw,5.5rem);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.05em;line-height:1}
  .ireloj .l{font-size:.66rem;letter-spacing:.2em;color:var(--tenue);font-weight:800;margin-top:.3rem}
  .ireloj .c.urg{color:var(--cian)}

  /* ---------- final ---------- */
  .fgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(1.3rem,3.5vw,3rem);align-items:start}
  .ftit{font-size:clamp(1.45rem,3vw,2.5rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;max-width:18ch}
  .hist{font-size:clamp(.88rem,1.15vw,1.02rem);line-height:1.5;font-weight:300;margin-top:.8rem;max-width:54ch}
  .hist b{font-weight:700}
  .epi{font-size:.88rem;color:var(--tenue);margin-top:.6rem;max-width:52ch;line-height:1.45}
  .vfin{display:flex;gap:1.4rem;margin-top:.9rem;flex-wrap:wrap}
  .vfin .v{display:flex;align-items:center;gap:.4rem;font-size:.82rem;color:var(--tenue)}
  .vfin .cor{color:#fff;letter-spacing:.1em;font-size:1rem}
  .vfin .cor i{color:rgba(255,255,255,.2);font-style:normal}
  .rej{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.6rem,1fr));gap:.35rem;margin-top:.5rem}
  .slot{border:1px solid var(--borde);border-radius:8px;padding:.4rem .55rem;font-size:.68rem;line-height:1.22;
        min-height:2.7rem;display:flex;align-items:center}
  .slot.on{background:var(--azul2);border-color:var(--cian);font-weight:700}
  .slot.off{border-style:dashed;color:rgba(255,255,255,.33)}
  .caja{background:var(--azul2);border-radius:13px;padding:.95rem 1.1rem;margin-bottom:.7rem}
  .caja h3{font-size:.92rem;margin-bottom:.4rem}
  .caja li,.caja p{font-size:.8rem;line-height:1.4;color:var(--tenue);list-style:none}
  .caja li b{color:#fff}
  .cont{font-size:.78rem;color:var(--tenue);line-height:1.55;margin-top:.9rem;border-top:1px solid var(--borde);padding-top:.7rem}
  .cont b{color:#fff;font-weight:600}
  .acc{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.1rem}
  .b1{background:#fff;color:var(--azul);border-radius:9px;padding:.72rem 1.45rem;font-weight:800}
  .b2{border:1px solid var(--borde);border-radius:9px;padding:.72rem 1.15rem;color:var(--tenue)}

  /* ---------- config / guion / libreto ---------- */
  .cfg{position:fixed;inset:0;z-index:45;background:#00174a;overflow-y:auto;padding:clamp(1.5rem,5vw,3.5rem)}
  .cfg h2{font-size:1.5rem;letter-spacing:-.02em}
  .cfg .d{font-size:.88rem;color:var(--tenue);max-width:54ch;margin:.5rem 0 1.6rem;line-height:1.5}
  .campo{margin-bottom:1.1rem;max-width:34rem}
  .campo label{display:block;font-size:.72rem;font-weight:800;color:var(--cian);margin-bottom:.3rem;letter-spacing:.05em}
  .campo input,.campo select{width:100%;background:var(--azul2);border:1px solid var(--borde);border-radius:9px;
    padding:.7rem .9rem;color:#fff;font-size:.95rem}
  .campo .ay{font-size:.76rem;color:rgba(255,255,255,.45);margin-top:.3rem;line-height:1.4}

  .guion{position:fixed;right:0;top:0;bottom:0;width:min(28rem,92vw);z-index:40;background:#00174a;
         border-left:1px solid var(--borde);padding:1.4rem 1.5rem;overflow-y:auto}
  .guion h2{font-size:1rem}
  .guion .adv{font-size:.74rem;color:var(--tenue);margin:.2rem 0 1rem;line-height:1.45}
  .gi{margin-bottom:1rem;border-left:2px solid var(--azul2);padding-left:.8rem}
  .gi .q{font-size:.63rem;font-weight:800;color:var(--cian);margin-bottom:.1rem;letter-spacing:.04em}
  .gi p{font-size:.87rem;line-height:1.48;color:rgba(255,255,255,.88)}
  .guion .x{position:absolute;top:.8rem;right:1rem;font-size:1.3rem;color:var(--tenue)}
  .oculto{display:none!important}

  .lib{position:fixed;inset:0;z-index:50;background:#fff;color:var(--azul);overflow-y:auto;padding:clamp(1.3rem,5vw,3rem)}
  .lib h1{font-size:clamp(1.4rem,2.8vw,2rem);letter-spacing:-.02em}
  .lib .lead{max-width:62ch;margin:.5rem 0 1.8rem;line-height:1.55;color:#1c3a68}
  .lb{border-top:1px solid #ccd8e8;padding:1.1rem 0;max-width:82ch}
  .lb h2{font-size:1.05rem;margin-bottom:.25rem}
  .lb p{font-size:.92rem;line-height:1.5;color:#16325c;margin-bottom:.3rem}
  .lb .o2{margin-left:1rem}
  .lb .say{background:#eef3f9;border-radius:9px;padding:.65rem .9rem;margin-top:.5rem;font-size:.9rem;line-height:1.45}
  .lb .say b{display:block;font-size:.66rem;color:var(--azul2);margin-bottom:.08rem}
  .xlib{position:fixed;top:1rem;right:1.1rem;background:var(--azul);color:#fff;border-radius:8px;
        padding:.5rem 1rem;font-size:.86rem;font-weight:800;z-index:51}
  .cartas{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;max-width:52rem;margin-top:.8rem}
  .cta{border:2px solid var(--azul);border-radius:13px;aspect-ratio:3/4;display:grid;place-items:center;
       font-size:3.5rem;font-weight:800;color:var(--azul)}
  .cta.b{background:var(--azul);color:#fff}
  .cta.c{background:var(--azul2);color:#fff;border-color:var(--azul2)}

  @media (max-width:1050px){
    .dec,.fgrid{grid-template-columns:1fr;gap:1.2rem}
    .pers{grid-template-columns:1fr}
    .linea{max-width:none}
    .vida .lb{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media print{
    body{background:#fff;color:#000;overflow:visible}
    .app,.guion,.xlib{display:none!important}
    .lib{position:static;padding:0}
    .cartas{grid-template-columns:repeat(2,1fr)}
    .cta{page-break-inside:avoid}
  }
</style>
</head>
<body>

<div class="app">
  <div class="hud off" id="hud">
    <button class="batras" id="bAtras" disabled>&#9664; Atrás</button>
    <div class="hud-p"><div class="avatar-mini" id="hAv"></div><div><div class="hud-nom" id="hNom">—</div><div class="hud-ruta" id="hRuta">—</div></div></div>
    <div class="vidas" id="hVidas"></div>
    <div class="objs"><span class="n" id="hObj">0</span><span class="l">objetos<br>desbloqueados</span></div>
  </div>
  <div class="zona" id="zona"></div>
</div>

<div class="guion oculto" id="guion">
  <button class="x" id="xGuion" aria-label="Cerrar">&times;</button>
  <h2>Guion de esta escena</h2>
  <p class="adv">Solo para ensayo. Tecla <kbd>G</kbd>.</p>
  <div id="gCont"></div>
</div>

<script>
/* ==========================================================
   UNISABANA MODO HISTORIA — borrador 5
   14 decisiones · Bienestar 5 · Internacional 5 · Emprendimiento 4
   ========================================================== */

const OBJ = {
  adaptacion:{corto:"Seguimiento y acompañamiento", due:"Bienestar", n:"Seguimiento, acompañamiento y apoyo formativo", i:[
    "Tutoría para Becarios: un estudiante mayor asignado a ti",
    "Sabana tu Segundo Hogar, si llegas de otra ciudad"]},
  buddy:{corto:"Buddy Program", due:"Internacional", n:"Buddy Program", i:[
    "Acompañas a un estudiante extranjero todo su semestre",

function din(cual){
  const r=S.ruta, v=S.via;
  if(cual==="d8"){
    if(r==="escenario") return {kick:"Sexto semestre · sala de ensayo",
      texto:"Faltan tres semanas para el festival y <strong>no hay plata para los trajes</strong>."};
    if(r==="cancha") return {kick:"Sexto semestre · vestuario",
      texto:"Clasificaron al torneo nacional y <strong>el bus no está pago</strong>."};
    return {kick:"Sexto semestre · bodega",
      texto:"La brigada creció a cuarenta personas y <strong>ya no cabe en un camión prestado</strong>."};
  }
  if(cual==="d9"){
    if(r==="escenario") return {kick:"Sexto semestre · un mes después",
      texto:"Una empresa les ofrece <strong>pagarles</strong> por tocar en su fiesta de fin de año."};
    if(r==="cancha") return {kick:"Sexto semestre · un mes después",
      texto:"Una marca les ofrece <strong>pagarles</strong> por usar su logo en el uniforme."};
    return {kick:"Sexto semestre · un mes después",
      texto:"Una alcaldía les ofrece <strong>pagarles</strong> por replicar la brigada en otro municipio."};
  }
  if(cual==="d11"){
    return S.flags.theo
      ? {kick:"Octavo semestre · 8:04 a. m.", texto:"Y entra un mensaje de alguien que {N} conoció el primer día.",
         dlg:{q:"Théo", l:"Vi la convocatoria. Mi universidad tiene cupo en tu programa. Vente."}}
      : {kick:"Octavo semestre · 8:04 a. m.", texto:"Seis días para decidir algo que <strong>nadie en su familia ha hecho antes</strong>."};
  }
  if(cual==="d12"){
    const d = v==="nacional" ? "la universidad donde estuvo el semestre, que tiene convenio con una de Chile"
      : v==="verano" ? "la universidad donde hizo el verano" : "la universidad donde estuvo el semestre";
    return {kick:"Noveno semestre", texto:"Llega una oferta desde "+d+": <strong>terminar la carrera allá</strong>."};
  }
  if(cual==="d13"){
    if(v==="nacional") return {kick:"Décimo semestre",
      texto:"Volvió de la otra ciudad con <strong>una idea que aquí no existe</strong>."};
    if(v==="verano") return {kick:"Décimo semestre",
      texto:"Volvió de cuatro semanas con una libreta llena y <strong>una idea que aquí no existe</strong>."};
    return {kick:"Décimo semestre",
      texto:"Volvió con <strong>una idea que aquí no existe</strong>. Y no se le quita de la cabeza."};
  }
  return {};
}

const CARAS=["\uD83D\uDE2B","\uD83D\uDE1F","\uD83D\uDE10","\uD83D\uDE04"];
function corazones(v){
  const n = v>=67?3 : v>=34?2 : v>=1?1 : 0;
  let s="";
  for(let i=0;i<3;i++) s += i<n ? "\u2665" : "<i>\u2665</i>";
  return {html:s, n:n, cara:CARAS[n]};
}

function reset(){
  S={nombre:"",pj:null,ruta:"",via:"",flags:{},med:{energia:60,parche:30,mundo:20},frags:[],inv:[]};
  HIST=[]; mSel=0; pend=null; ir("titulo");
}
function snap(){ return {nodo:nodo, S:JSON.parse(JSON.stringify(S)), pend:pend?JSON.parse(JSON.stringify(pend)):null}; }
function avanzar(id){ HIST.push(snap()); ir(id); }
function ir(id){ nodo=id; pararReloj(); detenerTimer(); render(); }
function atras(){
  if(!HIST.length) return;
  const h=HIST.pop(); S=h.S; pend=h.pend; nodo=h.nodo;
  pararReloj(); detenerTimer();
  const fl=document.querySelector(".flash"); if(fl) fl.remove();
  if(nodo==="_cons"){ pCons(); hud(); pintarGuion(); } else render();
}
function txt(s){ return (s||"").replace(/\{N\}/g, S.nombre||"nuestro personaje"); }

function hud(){
  const n=N[nodo];
  $hud.classList.toggle("off", !!n && (n.tipo==="titulo"||n.tipo==="personaje"));
  $atras.disabled = HIST.length===0;
  document.getElementById("hNom").textContent=S.nombre||"—";
  const hAv=document.getElementById("hAv");
  if(hAv) hAv.innerHTML = S.pj ? avatarSVG(S.pj) : "";
  document.getElementById("hRuta").textContent=(S.ruta?RUTAS[S.ruta]:"Sin ruta")+(S.via?" · "+VIAS[S.via]:"");
  const d=[["energia","ENERGÍA"],["parche","PARCHE"],["mundo","HORIZONTE"]];
  document.getElementById("hVidas").innerHTML=d.map(function(x){
    const c=corazones(S.med[x[0]]);
    return '<div class="vida" data-m="'+x[0]+'"><span class="cara">'+c.cara+'</span>'+
           '<span class="cor">'+c.html+'</span><span class="lb">'+x[1]+'</span></div>';}).join("");
  document.getElementById("hObj").textContent=S.inv.length;
}

function flash(antes){
  const nom={energia:"Energía",parche:"Parche",mundo:"Horizonte"}, p=[];
  ["energia","parche","mundo"].forEach(function(k){
    const a=corazones(antes[k]), b=corazones(S.med[k]);
    if(a.n!==b.n) p.push(nom[k]+" "+(b.n>a.n?"\u25B2":"\u25BC")+" "+b.cara);
    else if(antes[k]!==S.med[k]) p.push(nom[k]+" "+(S.med[k]>antes[k]?"\u25B2":"\u25BC"));
  });
  if(!p.length) return;
  const v=document.querySelector(".flash"); if(v) v.remove();
  const d=document.createElement("div"); d.className="flash"; d.textContent=p.join("   ");
  document.body.appendChild(d); setTimeout(function(){d.remove();},2800);
  document.querySelectorAll(".vida").forEach(function(el){
    el.classList.add("pulso"); setTimeout(function(){el.classList.remove("pulso");},300);});
}

function render(){
  const n=N[nodo];
  ({titulo:pTitulo,personaje:pPersonaje,acto:pActo,cine:pCine,dec:pDec,
    inv:pInv,invitada:pInvitada,final:pFinal})[n.tipo](n);
  hud(); pintarGuion(); $z.scrollTop=0;
}

  HIST.push(snap()); S.nombre=p.nombre; S.pj=p.k; S.med=Object.assign({},p.med); ir("actoI"); }

function pActo(n){
  $z.innerHTML='<div class="pant acto"><p class="acto-n">'+n.n+'</p><p class="acto-t">'+n.t+'</p>'+
    '<p class="acto-s">'+n.s+'</p><p class="pista">Espacio</p></div>';
}
function pCine(n){
  $z.innerHTML='<div class="pant">'+(n.kick?'<p class="kick">'+txt(n.kick)+'</p>':'')+
    '<p class="linea">'+txt(n.texto)+'</p><p class="pista">Espacio</p></div>';
}
function instr(mec,c){
  if(mec==="carta") return c===2?"Levanten la carta: azul = A, blanca = B":"Levanten la carta: azul = A, blanca = B. Sin carta = C";
  if(mec==="lados") return c===2?"Muévanse: A izquierda, B derecha":"Muévanse: A izquierda, B centro, C derecha";
  if(mec==="manos") return c===2?"Mano arriba por A. Ahora mano arriba por B":"Mano arriba por A, por B y por C";
  return "Griten la letra";
}
function pDec(n){
  const d=n.din?din(n.din):{};
  const kick=txt(d.kick||n.kick||""), tx=txt(d.texto||n.texto||""), dl=d.dlg||n.dlg;
  const ops=n.ops.map(function(o,i){
    return '<button class="op" data-i="'+i+'"><span class="k">'+o.k+'</span><span>'+txt(o.label)+'</span></button>';}).join("");
  $z.innerHTML='<div class="pant dec">'+(n.area?'<span class="duenio">'+n.area+'</span>':'')+
    '<div>'+(kick?'<p class="kick">'+kick+'</p>':'')+'<p class="linea">'+tx+'</p>'+
    (dl?'<div class="dlg"><span class="q">'+dl.q+'</span><p>'+txt(dl.l)+'</p></div>':'')+
    '</div><div class="voto"><p class="instr">'+instr(n.mec,n.ops.length)+'</p>'+ops+
    '<div class="fila"><button class="bv" id="bVot">Abrir votación</button><span class="reloj" id="rel"></span></div>'+
    '</div></div>';
  $z.querySelectorAll(".op").forEach(function(b){ b.onclick=function(){ elegir(+b.dataset.i); };});
  document.getElementById("bVot").onclick=abrirVoto;
}
function abrirVoto(){
  if(reloj) return; t=10;
  const r=document.getElementById("rel"), b=document.getElementById("bVot");
  if(b) b.textContent="Votando…"; if(r) r.textContent=t;
  reloj=setInterval(function(){ t--;
    if(r){ r.textContent=t>0?t:"¡Ya!"; if(t<=3) r.classList.add("urg"); }
    if(t<=0){ pararReloj(); if(b) b.textContent="Marca la ganadora"; }},1000);
}
function pararReloj(){ if(reloj){clearInterval(reloj);reloj=null;} }

function fmtT(s){ const m=Math.floor(Math.max(0,s)/60), r=Math.max(0,s)%60; return m+":"+(r<10?"0":"")+r; }
function detenerTimer(){ if(cTimer){clearInterval(cTimer);cTimer=null;} const el=document.getElementById("ctimer"); if(el) el.remove(); }
function iniciarTimer(segundos, etiqueta){
  detenerTimer();
  const el=document.createElement("div"); el.className="ctimer"; el.id="ctimer";
  el.innerHTML='<div class="lab">'+etiqueta+'</div><div class="c" id="ctimerC">'+fmtT(segundos)+'</div>';
  document.body.appendChild(el);
  let s2=segundos;
  cTimer=setInterval(function(){ s2--;
    const c=document.getElementById("ctimerC"); if(!c){clearInterval(cTimer);cTimer=null;return;}
    c.textContent=fmtT(s2); if(s2<=10) c.classList.add("urg");
    if(s2<=0){clearInterval(cTimer);cTimer=null;}
  },1000);
}

function elegir(i){
  const n=N[nodo], o=n.ops[i]; if(!o) return;
  pararReloj(); HIST.push(snap());
  const bs=$z.querySelectorAll(".op"); if(bs[i]) bs[i].classList.add("gana");
  const antes=Object.assign({},S.med);
  if(o.med) for(var k in o.med) S.med[k]=Math.max(0,Math.min(100,S.med[k]+o.med[k]));
  if(o.flag) S.flags[o.flag]=true;
  if(o.set) for(var j in o.set) S[j]=o.set[j];
  if(o.frag) S.frags.push({t:o.frag,c:!!o.clave});
  pend={cons:o.cons,next:o.next};
  setTimeout(function(){
    if(pend&&pend.cons){ nodo="_cons"; pCons(); hud(); pintarGuion(); flash(antes); }
    else { ir(pend.next); flash(antes); }},620);
}
function pCons(){
  const c=pend.cons;
  $z.innerHTML='<div class="pant cons"><p class="et">CONSECUENCIA</p><p class="kick">'+txt(c.kick)+'</p>'+
    '<p class="linea">'+txt(c.t)+'</p><p class="pista">Espacio</p></div>';
}

function pInv(n){
  n.objs.forEach(function(o){ if(S.inv.indexOf(o)===-1) S.inv.push(o); });
  const cs=n.objs.map(function(id){ const o=OBJ[id], idx=S.inv.indexOf(id)+1;
    return '<div class="card"><span class="idx">'+(idx<10?"0":"")+idx+'</span>'+
      '<span class="sello">DESBLOQUEADO</span><p class="due">'+o.due+'</p><h3>'+o.n+'</h3>'+
      '<ul>'+o.i.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul></div>';}).join("");
  $z.innerHTML='<div class="pant inv"><p class="et">'+txt(n.et)+'</p><h2>'+txt(n.titulo)+'</h2>'+
    '<div class="cards">'+cs+'</div>'+
    '<div class="pie"><button class="bseg" id="seg">Seguir</button><p class="npie">'+txt(n.nota||"")+'</p></div></div>';
  document.getElementById("seg").onclick=function(){ avanzar(n.next); };
  const areas=[]; n.objs.forEach(function(id){
    const a=OBJ[id].due.split(" \u00b7 ")[0].toUpperCase();
    if(areas.indexOf(a)===-1) areas.push(a);
  });
  const dur = 40 * areas.length + (n.objs.length>areas.length ? 20 : 0);
  iniciarTimer(dur, (areas.length>1?"HABLAN ":"HABLA ") + areas.join(" + "));
}

function pInvitada(n){
  $z.innerHTML='<div class="pant invit">'+
    '<p class="et">'+txt(n.kick)+'</p><p class="nom">'+INV.nombre+'</p>'+
    '<p class="rol">'+INV.rol+'. '+INV.linea+'</p>'+
    '<p class="real">'+txt(n.entrada)+'</p>'+
    '<div class="preg"><p class="l">PREGUNTA EN PANTALLA</p><p>'+txt(n.preg)+'</p></div>'+
    '<p class="pista">Espacio cuando termine</p></div>';
  iniciarTimer(180, "HABLA LA INVITADA");
}

function pFinal(){
  const r=S.ruta||"escenario", v=S.via||"semestre";
  let ti=(FINALES[r]&&FINALES[r][v])||"Tu propia ruta";
  if(S.flags.doble) ti="Con título internacional: "+ti.charAt(0).toLowerCase()+ti.slice(1);
  let fr=S.frags.filter(function(x){return x.c;}).map(function(x){return x.t;});
  if(fr.length<3) fr=S.frags.map(function(x){return x.t;});
  const ul=fr.pop();
  const hist="<b>"+S.nombre+"</b> "+fr.join(", ")+" y, al final, "+ul+
    ". Nada de eso aparecía en el pénsum. Y son solo seis de las catorce decisiones que tomaron hoy.";
  const ep=[];
  const ce=corazones(S.med.energia), cp=corazones(S.med.parche), cm=corazones(S.med.mundo);
  if(ce.n<=1) ep.push("Llegó al grado con la energía en el piso: esa parte también es real.");
  else if(ce.n===3) ep.push("Y llegó entero, que no es poca cosa.");
  if(cp.n===3) ep.push("No lo hizo solo en ningún momento.");
  else if(cp.n<=1) ep.push("Le tocó más solo de lo necesario, y no tenía por qué ser así.");
  if(cm.n===3) ep.push("Su hoja de vida cruzó fronteras antes del diploma.");
  const vfin=[["energia","Energía",ce],["parche","Parche",cp],["mundo","Horizonte",cm]].map(function(x){
    return '<div class="v"><span>'+x[2].cara+'</span><span class="cor">'+x[2].html+'</span><span>'+x[1]+'</span></div>';}).join("");
  const rej=TODOS.map(function(id){ const on=S.inv.indexOf(id)!==-1;
    return '<div class="slot '+(on?"on":"off")+'">'+OBJ[id].corto+'</div>';}).join("");

  $z.innerHTML='<div class="pant"><div class="fgrid"><div>'+
    '<p class="kick">Final desbloqueado · '+S.inv.length+' de '+TODOS.length+' objetos</p>'+
    '<h2 class="ftit">'+ti+'</h2><p class="hist">'+hist+'</p>'+
    (ep.length?'<p class="epi">'+ep.join(" ")+'</p>':'')+
    '<div class="vfin">'+vfin+'</div>'+
    '<div class="cont"><b>Bienestar y Experiencia del Estudiante</b> · experiencia.bienestar@unisabana.edu.co<br>'+
    '<b>Relaciones Internacionales</b> · mobility@unisabana.edu.co<br>'+
    '<b>Centro de Emprendimiento e Innovación</b> · ceis@unisabana.edu.co · Ad Portas, tercer piso</div>'+
    '</div><div>'+
    '<div class="caja"><h3>Inventario de la partida</h3>'+
    '<p>Lo punteado existe igual. Solo que esta historia cogió para otro lado.</p>'+
    '<div class="rej">'+rej+'</div></div></div></div>'+
    '<div class="acc"><button class="b1" id="otra">Jugar otra vez</button>'+
    '<button class="b2" id="lib2">Guion y kit de votación</button></div></div>';
  document.getElementById("otra").onclick=reset;
  document.getElementById("lib2").onclick=abrirLib;
}

function pintarGuion(){
  const n=N[nodo];
  if(!n||!n.guion){ $gc.innerHTML='<p class="adv">Sin guion en esta pantalla.</p>'; return; }
  let h='<div class="gi"><p class="q">MECÁNICA DE SALA</p><p>'+n.guion.mec+'</p></div>'+
        '<div class="gi"><p class="q">BIENESTAR</p><p>'+n.guion.bien+'</p></div>'+
        '<div class="gi"><p class="q">INTERNACIONAL</p><p>'+n.guion.inter+'</p></div>';
  if(n.guion.emp) h+='<div class="gi"><p class="q">EMPRENDIMIENTO</p><p>'+n.guion.emp+'</p></div>';
  $gc.innerHTML=h;
}

function abrirCfg(){
  const c=document.createElement("div"); c.className="cfg"; c.id="cfg";
  c.innerHTML='<h2>Configurar invitada</h2>'+
    '<p class="d">La estudiante que los acompaña no es un testimonio aparte: es un personaje de la historia. '+
    'Entra cuatro veces, como tutora del protagonista.</p>'+
    '<div class="campo"><label>NOMBRE</label><input id="cN" value="'+INV.nombre+'"></div>'+
    '<div class="campo"><label>ROL DENTRO DE LA HISTORIA</label><input id="cR" value="'+INV.rol+'">'+
    '<p class="ay">Por defecto es la tutora del PTB. Si su historia real encaja mejor en otro papel, cámbialo.</p></div>'+
    '<div class="campo"><label>UNA LÍNEA SOBRE LO QUE VIVIÓ</label><input id="cL" value="'+INV.linea+'"></div>'+
    '<div class="campo"><label>RUTA QUE MÁS SE PARECE A SU HISTORIA</label>'+
    '<select id="cRu"><option value="escenario">El escenario — cultura</option>'+
    '<option value="cancha">La cancha — deporte</option>'+
    '<option value="causa">La causa — solidaridad</option></select></div>'+
    '<button class="bv" id="cOk">Guardar y volver</button>';
  document.body.appendChild(c);
  document.getElementById("cRu").value=INV.ruta;
  document.getElementById("cOk").onclick=function(){
    INV.nombre=document.getElementById("cN").value||INV.nombre;
    INV.rol=document.getElementById("cR").value||INV.rol;
    INV.linea=document.getElementById("cL").value||INV.linea;
    INV.ruta=document.getElementById("cRu").value;
    c.remove(); render();
  };
}

function abrirLib(){
  const cuerpo=Object.keys(N).filter(function(k){return N[k].guion;}).map(function(k){
    const n=N[k];
    const ops=(n.ops||[]).map(function(o){
      return "<p class='o2'>"+o.k+". "+o.label+(o.cons?"  &rarr;  "+String(o.cons.t).replace(/<[^>]+>/g,""):"")+"</p>";}).join("");
    const ob=(n.objs||[]).map(function(id){
      return "<p><b>"+OBJ[id].n+"</b> ("+OBJ[id].due+"): "+OBJ[id].i.join("; ")+"</p>";}).join("");
    let says="<div class='say'><b>MECÁNICA DE SALA</b>"+n.guion.mec+"</div>"+
      "<div class='say'><b>BIENESTAR</b>"+n.guion.bien+"</div>"+
      "<div class='say'><b>INTERNACIONAL</b>"+n.guion.inter+"</div>";
    if(n.guion.emp) says+="<div class='say'><b>EMPRENDIMIENTO</b>"+n.guion.emp+"</div>";
    return "<section class='lb'><h2>"+k+(n.area?" · "+n.area:"")+" · "+(n.kick||n.titulo||n.t||"")+"</h2>"+
      (n.texto?"<p>"+String(n.texto).replace(/<[^>]+>/g,"")+"</p>":"")+
      (n.entrada?"<p>"+String(n.entrada).replace(/<[^>]+>/g,"")+"</p>":"")+
      (n.preg?"<p><b>Pregunta a la invitada:</b> "+n.preg+"</p>":"")+
      ops+ob+says+"</section>";}).join("");

  const c=document.createElement("div"); c.className="lib";
  c.innerHTML="<h1>UniSabana Modo Historia — guion completo</h1>"+
    "<p class='lead'>Catorce decisiones repartidas entre las tres áreas: Bienestar cinco, Internacional cinco, "+
    "Centro de Emprendimiento cuatro. Cuatro entradas de la invitada dentro de la ficción.</p>"+
    "<section class='lb'><h2>Reparto de los 50 minutos</h2>"+
    "<p class='o2'>Título, selección de personaje y reglas — 4 min</p>"+
    "<p class='o2'>Acto I, cinco decisiones (Intl, Bien, Bien, Emp, Intl) — 11 min</p>"+
    "<p class='o2'>Invitada, entrada 1 — 3 min</p>"+
    "<p class='o2'>Acto II, cinco decisiones (Bien, Intl, Bien, Emp, Bien) — 11 min</p>"+
    "<p class='o2'>Invitada, entrada 2 — 3 min</p>"+
    "<p class='o2'>Acto III, cuatro decisiones (Intl, Intl, Emp, Emp) — 9 min</p>"+
    "<p class='o2'>Invitada, entradas 3 y 4 — 5 min</p>"+
    "<p class='o2'>Final e inventario — 3 min</p>"+
    "<p><b>Total: 49 minutos, sin un segundo de sobra.</b> Cada decisión tiene 2 minutos y 12 segundos: leer la escena, "+
    "votar, ver la consecuencia y comentar la carta. Si en el ensayo una decisión se pasa de dos minutos y medio, "+
    "el evento se desborda. Ensáyenlo con cronómetro antes.</p>"+
    "<p><b>Válvula de escape:</b> si van tarde llegando al acto III, corten la entrada 4 de la invitada (2 min) y "+
    "no comenten la carta de la decisión 14: el Centro ya habló tres veces antes.</p></section>"+
    "<section class='lb'><h2>Kit de votación</h2>"+
    "<p><b>Materiales:</b> una carta por estudiante, azul de un lado, blanca del otro.</p>"+
    "<p class='o2'>Carta — levantan la carta. Hasta 60 personas, cuentas a ojo.</p>"+
    "<p class='o2'>Lados — se paran y se mueven. Para las decisiones que parten la historia.</p>"+
    "<p class='o2'>Manos — para los momentos íntimos.</p>"+
    "<p class='o2'>Grito — solo para desempatar. El presentador nunca desempata.</p>"+
    "<p><b>Ritmo:</b> diez segundos y se cierra. Sin discusión previa: la gracia es decidir en caliente.</p>"+
    "<p><b>Si se equivocan al marcar:</b> el botón Atrás del HUD, o la flecha izquierda, devuelve la partida "+
    "a la pantalla anterior con las vidas y los objetos como estaban.</p>"+
    "<p><b>Temporizador de esquina:</b> aparece solo, abajo a la derecha, apenas se revela una carta o entra la invitada. "+
    "Dice qué área habla y cuánto tiempo tiene: 40 segundos por área, 20 más si la carta trae más de un objeto por área. "+
    "Cuando marca 0:00 no se apaga solo; es la señal para que el presentador cierre y siga. Está pensado para que nadie "+
    "tenga que mirar el reloj propio a media frase.</p></section>"+
    "<section class='lb'><h2>Cartas para imprimir</h2>"+
    "<div class='cartas'><div class='cta'>A</div><div class='cta b'>B</div><div class='cta c'>C</div></div></section>"+
    "<section class='lb'><h2>Las tres vidas</h2>"+
    "<p>Tres corazones por categoría. Tres corazones, cara feliz; dos, cara neutra; uno, cara preocupada; ninguno, cara de agotamiento.</p>"+
    "<p class='o2'>Energía — cuánto aguanta el cuerpo. La bajan los trasnochos y el exceso; la suben el CAF, el CREA y parar a tiempo.</p>"+
    "<p class='o2'>Parche — con cuánta gente cuenta. La sube meterse, pedir ayuda y acompañar; la baja aislarse.</p>"+
    "<p class='o2'>Horizonte — qué tanto se abrió. La suben el idioma, los proyectos con otros países y moverse.</p>"+
    "<p>Al final, las tres caritas cambian el epílogo que se lee en voz alta.</p></section>"+
    "<section class='lb'><h2>La invitada</h2>"+
    "<p>No es un testimonio al final: es la tutora del protagonista y entra cuatro veces dentro de la ficción. "+
    "Prepara las cuatro preguntas con ella <b>antes</b> y avísale que la cortas a los tres minutos.</p>"+
    "<p class='o2'>1. Semana 16, sala del CREA — ¿cómo fue tu primer semestre de verdad?</p>"+
    "<p class='o2'>2. La misma plaza, otro miércoles — ¿qué te dio tu ruta y qué viste de las otras dos?</p>"+
    "<p class='o2'>3. Octavo semestre — ¿cómo decidiste irte y qué encontraste?</p>"+
    "<p class='o2'>4. Hoy, aquí — ¿qué le dirías al protagonista del primer día?</p></section>"+
    cuerpo;
  const x=document.createElement("button"); x.className="xlib"; x.textContent="Cerrar";
  x.onclick=function(){ c.remove(); x.remove(); };
  document.body.appendChild(c); document.body.appendChild(x); x.focus();
}

document.getElementById("xGuion").onclick=function(){ $guion.classList.toggle("oculto"); };
$atras.onclick=atras;

document.addEventListener("keydown",function(e){
  const k=e.key.toLowerCase();
  if(k==="g"){e.preventDefault();$guion.classList.toggle("oculto");return;}
  if(k==="r"){e.preventDefault();reset();return;}
  if(k==="f"){e.preventDefault();
    if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); return;}
  if(document.querySelector(".lib")||document.querySelector(".cfg")) return;
  if(k==="arrowleft"||k==="backspace"){e.preventDefault();atras();return;}
  if(nodo==="_cons"){ if(k===" "||k==="enter"||k==="arrowright"){e.preventDefault();avanzar(pend.next);} return; }
  const n=N[nodo]; if(!n) return;
  if(n.tipo==="titulo"){
    if(k==="arrowdown"){e.preventDefault();mSel=(mSel+1)%MENU.length;pintarMenu();return;}
    if(k==="arrowup"){e.preventDefault();mSel=(mSel+MENU.length-1)%MENU.length;pintarMenu();return;}
    if(k==="enter"){e.preventDefault();MENU[mSel].f();return;}
    if(k===" "){e.preventDefault();avanzar("personaje");return;}
    return;
  }
  if(n.tipo==="dec"){
    if(k==="v"){e.preventDefault();abrirVoto();return;}
    const i={a:0,b:1,c:2}[k];
    if(i!==undefined){e.preventDefault();elegir(i);return;}
  }
  if(n.tipo==="personaje"){ const i={a:0,b:1,c:2}[k];
    if(i!==undefined){e.preventDefault();elegirPj(i);return;} }
  if(k===" "||k==="enter"||k==="arrowright"){
    e.preventDefault();
    if(["acto","cine","inv","invitada"].indexOf(n.tipo)!==-1) avanzar(n.next);
  }
});

reset();
</script>
